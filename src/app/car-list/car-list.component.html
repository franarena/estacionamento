<div class="filters">
  <input 
    type="text" 
    [(ngModel)]="searchTerm" 
    placeholder="Cerca marca o modello..." 
    class="search-bar"
  >


  <!-- Slider Prezzo -->
  <div class="price-filter">
    <label>Giorni dall'ultimo pagamento: {{ maxDays }} giorni</label>
    <input 
      type="range" 
      min="0" 
      max="365" 
      step="1" 
      [(ngModel)]="maxDays"
    >
  </div>  
</div>

<div class="car-grid">
  <!-- Usa filteredCars invece di cars -->
  <div class="car-card" *ngFor="let car of filteredCars">
    <img [src]="car.imageUrl" [alt]="car.brand" class="car-image">
    <div class="car-info">
      <h3>{{ car.brand }} {{ car.model }}</h3>
      <p class="days-since-last-payment">{{ car.daysSinceLastPayment }} giorni</p>
    </div>
  </div>
</div>

<!-- Messaggio se non ci sono risultati -->
<p *ngIf="filteredCars.length === 0">Nessuna auto trovata per "{{ searchTerm }}"</p>
