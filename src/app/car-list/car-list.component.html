<div class="car-grid">
  <div class="car-card" *ngFor="let car of cars">
    <img [src]="car.imageUrl" [alt]="car.brand + ' ' + car.model" class="car-image">
    <div class="car-info">
      <h3>{{ car.brand }} {{ car.model }}</h3>
      <p class="price">{{ car.price | currency:'EUR' }}</p>
    </div>
  </div>
</div>
